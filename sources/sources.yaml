# Canonical source registry for Open Prompt Archive.
# Schema: ../schema/source.schema.json
#
# Scope: third-party openly redistributable prompt sources only.
# Carnaverone Studio first-party/private prompt collections are out of scope.
#
# Status values:
#   candidate | review | approved | quarantined | rejected
#
# Only approved sources may contribute prompt content to data/.
# Candidate/review/quarantined/rejected sources may retain metadata and review notes,
# but their unapproved prompt corpus must not be redistributed here.

schema_version: 1
project: open-prompt-archive

sources:
  - source_id: prompts-chat
    name: prompts.chat prompt corpus
    canonical_url: https://github.com/f/prompts.chat
    owner: f / prompts.chat
    source_type: github-repository
    status: approved
    license:
      spdx: CC0-1.0
      evidence_url: https://github.com/f/prompts.chat/blob/25cb43d6e61974e66f3650cbc5a65482bc592552/LICENSE
      scope_verified: true
      attribution_required: false
      attribution_text: null
    scope: "Prompt text/data explicitly covered by the upstream CC0 declaration, including prompts.csv, PROMPTS.md, and user-submitted prompt text; software, book content, branding, and media excluded."
    reviewed_revision: 25cb43d6e61974e66f3650cbc5a65482bc592552
    discovered_at: 2026-08-23
    reviewed_at: 2026-08-23
    media_mirroring: not-allowed
    review_file: sources/reviews/prompts-chat.md
    notes: "Approved for prompt text/data only. Provenance should still be preserved even though CC0 does not require attribution."

  - source_id: diffusiondb
    name: DiffusionDB
    canonical_url: https://github.com/poloclub/diffusiondb
    owner: Polo Club / Georgia Institute of Technology
    source_type: research-dataset
    status: approved
    license:
      spdx: CC0-1.0
      evidence_url: https://github.com/poloclub/diffusiondb/blob/bf0b01ee26119e16436fa67656ccb611f61be95f/README.md#licensing
      scope_verified: true
      attribution_required: false
      attribution_text: null
    scope: "Prompt text and prompt-generation metadata from the DiffusionDB dataset; images and other media excluded from Open Prompt Archive."
    reviewed_revision: bf0b01ee26119e16436fa67656ccb611f61be95f
    discovered_at: 2026-08-23
    reviewed_at: 2026-08-23
    media_mirroring: not-allowed
    review_file: sources/reviews/diffusiondb.md
    notes: "Approved prompt-only scope. Import requires content-policy filtering and should omit hashed user identifiers/timestamps unless specifically justified for provenance."

  - source_id: bigscience-promptsource
    name: BigScience PromptSource / P3 prompt templates
    canonical_url: https://github.com/bigscience-workshop/promptsource
    owner: BigScience Workshop contributors
    source_type: github-repository
    status: approved
    license:
      spdx: Apache-2.0
      evidence_url: https://github.com/bigscience-workshop/promptsource/blob/7dab96a3eeb3717cea633705135ebc488885d709/LICENSE
      scope_verified: true
      attribution_required: true
      attribution_text: "BigScience PromptSource/P3 contributors; retain applicable Apache-2.0 license, copyright, and attribution notices."
    scope: "Prompt template definitions under promptsource/templates/ and prompt-specific metadata only; underlying datasets, rendered examples, and associated media excluded."
    reviewed_revision: 7dab96a3eeb3717cea633705135ebc488885d709
    discovered_at: 2026-08-23
    reviewed_at: 2026-08-23
    media_mirroring: not-allowed
    review_file: sources/reviews/bigscience-promptsource.md
    notes: "Approved template-only scope. External dataset examples and dataset licenses remain independent and must not be imported through template rendering."

  - source_id: wuyoscar-gpt-image2-skill
    name: Wuyoscar GPT-Image2-Skill gallery
    canonical_url: https://github.com/wuyoscar/GPT-Image2-Skill
    owner: Wuyoscar and repository contributors
    source_type: github-repository
    status: review
    license:
      spdx: MIT
      evidence_url: https://github.com/wuyoscar/GPT-Image2-Skill/blob/068dd9e24aadc8731e46f38548ca4dcd94515d35/LICENSE
      scope_verified: false
      attribution_required: true
      attribution_text: "Wuyoscar / GPT-Image2-Skill; preserve the MIT copyright and permission notice for material ultimately verified as covered."
    scope: "Gallery prompt provenance is under renewed record-level review. Explicit outside-source entries are excluded; the current Curated label is not treated as proof of repository-original authorship. Images/media excluded."
    reviewed_revision: 068dd9e24aadc8731e46f38548ca4dcd94515d35
    discovered_at: 2026-08-23
    reviewed_at: 2026-08-23
    media_mirroring: not-allowed
    review_file: sources/reviews/wuyoscar-gpt-image2-skill.md
    notes: "Prior restricted approval was reopened after the pinned canonical gallery showed Curated entries while CONTRIBUTING.md documents Original as the original-entry signal. Curated can mean repo-curated or substantially reworked, so the mechanical rights boundary requires stronger evidence before any prompt publication."

