# Canonical source registry for Open Prompt Archive.
# Schema: ../schema/source.schema.json
#
# Scope: third-party openly redistributable prompt sources only.
# Carnaverone Studio first-party/private prompt collections are out of scope.
#
# Status values:
#   candidate | review | approved | quarantined | rejected
#
# Only approved sources may contribute prompt content to data/.
# Candidate/quarantined/rejected sources may retain metadata and review notes,
# but their unapproved prompt corpus must not be redistributed here.
#
# Example shape (documentation only; do not uncomment without evidence):
#
# - source_id: example-source
#   name: Example Source
#   canonical_url: https://example.org/prompts
#   owner: Example Organization
#   source_type: dataset-host
#   status: candidate
#   license:
#     spdx: UNKNOWN
#     evidence_url: null
#     scope_verified: false
#     attribution_required: false
#     attribution_text: null
#   scope: "Prompt text under review; associated media excluded."
#   reviewed_revision: null
#   discovered_at: 2026-08-23
#   reviewed_at: null
#   media_mirroring: not-reviewed
#   review_file: null
#   notes: null

schema_version: 1
project: open-prompt-archive
sources: []
